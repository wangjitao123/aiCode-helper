kotlin.code.style=official
org.gradle.configuration-cache=false
org.gradle.caching=true

# The IntelliJ Platform already ships a Kotlin stdlib; don't let the Kotlin Gradle plugin
# bundle a second (possibly conflicting) one into the plugin. See https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false

# Global JAVA_HOME points to JDK 8, but IntelliJ Platform Gradle plugin 2.x needs JDK 17+ to load.
# Pin the Gradle JVM to the local JDK 17 to avoid UnsupportedClassVersionError.
# On another machine, change this to your local JDK 17/21 path, or remove this line and set JAVA_HOME to 17+.
org.gradle.java.home=D:/jdk17

